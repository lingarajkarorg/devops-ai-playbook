apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lingarajkarorg/devops-ai-playbook.git
    targetRevision: kind-local
    path: local/kind-overlay
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    syncOptions:
      - CreateNamespace=true